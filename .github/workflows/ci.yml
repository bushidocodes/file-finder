name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    name: Build & test (Ubuntu / GCC 14 / C23)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: sudo apt-get install -y gcc-14

      - name: Build release binary
        run: make

      - name: Run unit tests
        run: make test

      - name: Build debug binary (ThreadSanitizer)
        run: make debug

      - name: Run unit tests under ThreadSanitizer
        run: |
          gcc-14 -std=c23 -Wall -Wextra -O0 -g -pthread -fsanitize=thread \
              -Iinclude -Itests/unity \
              tests/test_con_str_vec.c tests/unity/unity.c \
              -o tests/test_con_str_vec_tsan
          ./tests/test_con_str_vec_tsan
