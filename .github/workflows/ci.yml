name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Ubuntu / GCC 14 / C23)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC 14
        run: sudo apt-get install -y gcc-14

      - name: Build release binary
        run: make

      - name: Run unit tests
        run: make test

      - name: Build debug binary (ThreadSanitizer)
        run: make debug

      - name: Run unit tests under ThreadSanitizer
        run: make tsan
